---
- name: Instalar Tomcat en RHEL 10 y generar CSR para Workflow
  hosts: tomcat_servers
  become: true
  gather_facts: true

  vars:

    # ============================================================
    # SERVIDOR
    # ============================================================

    tomcat_hostname: "tomcat"
    tomcat_domain: "ansible.demo.com"
    tomcat_fqdn: "{{ tomcat_hostname }}.{{ tomcat_domain }}"

    # ============================================================
    # TOMCAT
    # ============================================================

    tomcat_http_port: 8080
    tomcat_https_port: 8443

    # RHEL 10 incluye Tomcat 9 en AppStream
    tomcat_packages:
      - tomcat9
      - tomcat9-webapps
      - java-21-openjdk-headless
      - openssl
      - ca-certificates

    # ============================================================
    # CERTIFICADOS
    # ============================================================

    certificate_dir: "/etc/pki/tomcat"

    certificate_private_key:
      "{{ certificate_dir }}/{{ tomcat_fqdn }}.key.pem"

    certificate_csr:
      "{{ certificate_dir }}/{{ tomcat_fqdn }}.csr.pem"

    certificate_config:
      "{{ certificate_dir }}/{{ tomcat_fqdn }}.cnf"

    certificate_key_size: 4096

    # ============================================================
    # SUBJECT DEL CERTIFICADO
    # ============================================================

    certificate_country: "CL"
    certificate_state: "Santiago"
    certificate_locality: "Santiago"
    certificate_organization: "Ansible Demo"
    certificate_organizational_unit: "Infrastructure"

    # ============================================================
    # SUBJECT ALTERNATIVE NAMES
    # ============================================================

    certificate_dns_sans:
      - "{{ tomcat_fqdn }}"
      - "{{ tomcat_hostname }}"


  tasks:

    # ============================================================
    # VALIDAR SISTEMA OPERATIVO
    # ============================================================

    - name: Validar Red Hat Enterprise Linux
      ansible.builtin.assert:
        that:
          - ansible_distribution == "RedHat"
        fail_msg: >
          Este playbook requiere Red Hat Enterprise Linux.
          Sistema detectado:
          {{ ansible_distribution }}
          {{ ansible_distribution_version }}

    - name: Validar RHEL 10
      ansible.builtin.assert:
        that:
          - ansible_distribution_major_version == "10"
        fail_msg: >
          Este playbook está diseñado para RHEL 10.
          Versión detectada:
          {{ ansible_distribution_version }}

    - name: Mostrar información del sistema
      ansible.builtin.debug:
        msg:
          - "Sistema operativo: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Arquitectura: {{ ansible_architecture }}"
          - "Servidor Tomcat: {{ tomcat_fqdn }}"


    # ============================================================
    # CONFIGURAR HOSTNAME
    # ============================================================

    - name: Configurar hostname
      ansible.builtin.hostname:
        name: "{{ tomcat_fqdn }}"


    # ============================================================
    # VALIDAR REPOSITORIOS
    #
    # En AWS las imágenes RHEL suelen utilizar RHUI.
    #
    # No se fuerza subscription-manager.
    #
    # Se valida que existan:
    #
    # BaseOS
    # AppStream
    #
    # ============================================================

    - name: Obtener repositorios habilitados
      ansible.builtin.command:
        cmd: dnf repolist --enabled
      register: enabled_repositories
      changed_when: false

    - name: Mostrar repositorios habilitados
      ansible.builtin.debug:
        var: enabled_repositories.stdout_lines


    # ============================================================
    # VALIDAR BASEOS
    # ============================================================

    - name: Validar repositorio BaseOS
      ansible.builtin.assert:
        that:
          - >
            'baseos' in
            (enabled_repositories.stdout | lower)
        fail_msg: |
          No se encontró un repositorio BaseOS habilitado.

          En una instancia RHEL 10 sobre AWS debería existir
          un repositorio RHUI correspondiente a BaseOS.

          Revise con:

          dnf repolist --all


    # ============================================================
    # VALIDAR APPSTREAM
    # ============================================================

    - name: Validar repositorio AppStream
      ansible.builtin.assert:
        that:
          - >
            'appstream' in
            (enabled_repositories.stdout | lower)
        fail_msg: |
          No se encontró un repositorio AppStream habilitado.

          Tomcat 9 y OpenJDK requieren contenido disponible
          desde AppStream.

          Revise con:

          dnf repolist --all


    # ============================================================
    # ACTUALIZAR CACHE DNF
    # ============================================================

    - name: Actualizar metadata DNF
      ansible.builtin.dnf:
        update_cache: true


    # ============================================================
    # VALIDAR DISPONIBILIDAD DE TOMCAT
    # ============================================================

    - name: Validar disponibilidad del paquete Tomcat
      ansible.builtin.command:
        cmd: dnf list available tomcat9
      register: tomcat_available
      changed_when: false
      failed_when: false

    - name: Validar que Tomcat esté disponible
      ansible.builtin.assert:
        that:
          - tomcat_available.rc == 0
        fail_msg: |
          El paquete tomcat9 no está disponible.

          Verifique que AppStream esté correctamente habilitado:

          dnf repolist
          dnf list available tomcat9


    # ============================================================
    # INSTALAR TOMCAT JAVA Y OPENSSL
    # ============================================================

    - name: Instalar paquetes necesarios
      ansible.builtin.dnf:
        name: "{{ tomcat_packages }}"
        state: present


    # ============================================================
    # VALIDAR JAVA
    # ============================================================

    - name: Obtener versión de Java
      ansible.builtin.command:
        cmd: java -version
      register: java_version
      changed_when: false

    - name: Mostrar versión de Java
      ansible.builtin.debug:
        var: java_version.stderr_lines


    # ============================================================
    # VALIDAR TOMCAT
    # ============================================================

    - name: Obtener versión instalada de Tomcat
      ansible.builtin.command:
        cmd: rpm -q tomcat9
      register: tomcat_version
      changed_when: false

    - name: Mostrar versión de Tomcat
      ansible.builtin.debug:
        var: tomcat_version.stdout


    # ============================================================
    # IDENTIFICAR SERVICIO SYSTEMD DE TOMCAT
    # ============================================================

    - name: Buscar servicio Tomcat instalado
      ansible.builtin.shell: |
        set -o pipefail

        systemctl list-unit-files \
          --type=service \
          --no-legend |
        awk '{print $1}' |
        grep -E '^tomcat.*\.service$' |
        head -1
      args:
        executable: /bin/bash
      register: tomcat_service_detect
      changed_when: false

    - name: Validar servicio Tomcat
      ansible.builtin.assert:
        that:
          - tomcat_service_detect.stdout | length > 0
        fail_msg: >
          No fue posible identificar el servicio systemd
          correspondiente a Tomcat.

    - name: Definir nombre servicio Tomcat
      ansible.builtin.set_fact:
        tomcat_service_name:
          "{{ tomcat_service_detect.stdout | regex_replace('\\.service$', '') }}"

    - name: Mostrar servicio Tomcat detectado
      ansible.builtin.debug:
        msg:
          - "Servicio Tomcat: {{ tomcat_service_name }}"


    # ============================================================
    # HABILITAR TOMCAT
    # ============================================================

    - name: Habilitar e iniciar Tomcat
      ansible.builtin.systemd:
        name: "{{ tomcat_service_name }}"
        enabled: true
        state: started


    # ============================================================
    # VALIDAR SERVICIO
    # ============================================================

    - name: Obtener estado Tomcat
      ansible.builtin.systemd:
        name: "{{ tomcat_service_name }}"
      register: tomcat_service

    - name: Validar Tomcat activo
      ansible.builtin.assert:
        that:
          - tomcat_service.status.ActiveState == "active"
        fail_msg: >
          El servicio Tomcat no está activo.


    # ============================================================
    # ESPERAR PUERTO TOMCAT
    #
    # NO se administra firewalld.
    #
    # El tráfico externo debe controlarse mediante:
    #
    # AWS Security Groups
    # AWS NACL
    #
    # ============================================================

    - name: Esperar puerto HTTP de Tomcat
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: "{{ tomcat_http_port }}"
        state: started
        timeout: 60


    # ============================================================
    # VALIDAR HTTP LOCAL
    # ============================================================

    - name: Validar Tomcat mediante HTTP
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ tomcat_http_port }}/"
        method: GET
        return_content: false

        status_code:
          - 200
          - 302
          - 403

      register: tomcat_http_test

      retries: 10
      delay: 3

      until:
        tomcat_http_test.status in [200, 302, 403]


    # ============================================================
    # CREAR DIRECTORIO PKI
    # ============================================================

    - name: Crear directorio PKI Tomcat
      ansible.builtin.file:
        path: "{{ certificate_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"


    # ============================================================
    # IDENTIFICAR GRUPO TOMCAT
    # ============================================================

    - name: Obtener grupo Tomcat
      ansible.builtin.command:
        cmd: getent group tomcat
      register: tomcat_group
      failed_when: false
      changed_when: false

    - name: Definir grupo para certificados
      ansible.builtin.set_fact:
        tomcat_certificate_group:
          "{{ 'tomcat' if tomcat_group.rc == 0 else 'root' }}"


    # ============================================================
    # AJUSTAR DIRECTORIO PKI
    # ============================================================

    - name: Configurar permisos directorio PKI
      ansible.builtin.file:
        path: "{{ certificate_dir }}"
        owner: root
        group: "{{ tomcat_certificate_group }}"
        mode: "0750"


    # ============================================================
    # GENERAR PRIVATE KEY
    #
    # IMPORTANTE:
    #
    # Esta clave permanece exclusivamente en el servidor Tomcat.
    #
    # Nunca se envía a la CA.
    #
    # ============================================================

    - name: Generar clave privada RSA
      ansible.builtin.command:
        argv:

          - openssl
          - genpkey

          - -algorithm
          - RSA

          - -pkeyopt
          - "rsa_keygen_bits:{{ certificate_key_size }}"

          - -out
          - "{{ certificate_private_key }}"

      args:
        creates: "{{ certificate_private_key }}"


    # ============================================================
    # PERMISOS PRIVATE KEY
    # ============================================================

    - name: Proteger clave privada
      ansible.builtin.file:
        path: "{{ certificate_private_key }}"
        owner: root
        group: "{{ tomcat_certificate_group }}"
        mode: "0640"


    # ============================================================
    # CONFIGURACION OPENSSL
    # ============================================================

    - name: Crear configuración CSR
      ansible.builtin.copy:

        dest: "{{ certificate_config }}"

        owner: root
        group: root
        mode: "0644"

        content: |
          [ req ]

          default_bits = {{ certificate_key_size }}

          prompt = no

          default_md = sha256

          distinguished_name = req_distinguished_name

          req_extensions = req_ext


          [ req_distinguished_name ]

          C = {{ certificate_country }}

          ST = {{ certificate_state }}

          L = {{ certificate_locality }}

          O = {{ certificate_organization }}

          OU = {{ certificate_organizational_unit }}

          CN = {{ tomcat_fqdn }}


          [ req_ext ]

          basicConstraints = critical,CA:FALSE

          keyUsage = critical,digitalSignature,keyEncipherment

          extendedKeyUsage = serverAuth

          subjectAltName = @alt_names


          [ alt_names ]

          {% for dns_name in certificate_dns_sans %}
          DNS.{{ loop.index }} = {{ dns_name }}
          {% endfor %}


    # ============================================================
    # GENERAR CSR
    # ============================================================

    - name: Generar CSR Tomcat
      ansible.builtin.command:
        argv:

          - openssl
          - req

          - -new

          - -sha256

          - -key
          - "{{ certificate_private_key }}"

          - -config
          - "{{ certificate_config }}"

          - -out
          - "{{ certificate_csr }}"

      args:
        creates: "{{ certificate_csr }}"


    # ============================================================
    # PERMISOS CSR
    # ============================================================

    - name: Configurar permisos CSR
      ansible.builtin.file:
        path: "{{ certificate_csr }}"
        owner: root
        group: root
        mode: "0644"


    # ============================================================
    # VALIDAR CSR
    # ============================================================

    - name: Validar integridad CSR
      ansible.builtin.command:
        argv:

          - openssl
          - req

          - -in
          - "{{ certificate_csr }}"

          - -noout

          - -verify

      register: csr_verify

      changed_when: false


    # ============================================================
    # OBTENER SUBJECT
    # ============================================================

    - name: Obtener Subject CSR
      ansible.builtin.command:
        argv:

          - openssl
          - req

          - -in
          - "{{ certificate_csr }}"

          - -noout

          - -subject

      register: csr_subject

      changed_when: false


    # ============================================================
    # OBTENER INFORMACION CSR
    # ============================================================

    - name: Obtener información CSR
      ansible.builtin.command:
        argv:

          - openssl
          - req

          - -in
          - "{{ certificate_csr }}"

          - -noout

          - -text

      register: csr_information

      changed_when: false


    # ============================================================
    # LEER CSR
    # ============================================================

    - name: Leer CSR generado
      ansible.builtin.slurp:
        src: "{{ certificate_csr }}"
      register: csr_file


    # ============================================================
    # PUBLICAR VARIABLES PARA AAP WORKFLOW
    #
    # El CSR se transforma nuevamente desde Base64 a formato PEM.
    #
    # Estas variables estarán disponibles para el siguiente
    # Job Template del Workflow.
    #
    # ============================================================

    - name: Publicar CSR para siguiente Job Template
      ansible.builtin.set_stats:

        data:

          certificate_request_fqdn:
            "{{ tomcat_fqdn }}"

          certificate_request_hostname:
            "{{ tomcat_hostname }}"

          certificate_request_domain:
            "{{ tomcat_domain }}"

          certificate_request_type:
            "server"

          certificate_request_profile:
            "server_cert"

          certificate_request_csr:
            "{{ csr_file.content | b64decode }}"

          certificate_request_target_host:
            "{{ inventory_hostname }}"

          certificate_request_private_key_path:
            "{{ certificate_private_key }}"

          certificate_request_certificate_dir:
            "{{ certificate_dir }}"

          certificate_request_http_port:
            "{{ tomcat_http_port }}"

          certificate_request_https_port:
            "{{ tomcat_https_port }}"

          certificate_request_service_name:
            "{{ tomcat_service_name }}"

        per_host: false


    # ============================================================
    # RESULTADO
    # ============================================================

    - name: Mostrar resultado final
      ansible.builtin.debug:

        msg:

          - "=========================================================="
          - "        TOMCAT RHEL 10 INSTALADO CORRECTAMENTE"
          - "=========================================================="

          - ""

          - "Sistema:"
          - "  {{ ansible_distribution }} {{ ansible_distribution_version }}"

          - ""

          - "Servidor:"
          - "  {{ tomcat_fqdn }}"

          - ""

          - "Tomcat:"
          - "  {{ tomcat_version.stdout }}"

          - ""

          - "Servicio:"
          - "  {{ tomcat_service_name }}"

          - ""

          - "Java:"
          - "  OpenJDK 21"

          - ""

          - "HTTP local:"
          - "  http://127.0.0.1:{{ tomcat_http_port }}"

          - ""

          - "HTTP externo:"
          - "  http://{{ tomcat_fqdn }}:{{ tomcat_http_port }}"

          - ""

          - "Clave privada:"
          - "  {{ certificate_private_key }}"

          - ""

          - "CSR:"
          - "  {{ certificate_csr }}"

          - ""

          - "Subject:"
          - "  {{ csr_subject.stdout }}"

          - ""

          - "CSR verificado:"
          - "  OK"

          - ""

          - "Artifact AAP:"
          - "  certificate_request_csr"

          - ""

          - "Perfil certificado:"
          - "  server_cert"

          - ""

          - "La clave privada permanece en:"
          - "  {{ tomcat_fqdn }}"

          - ""

          - "La clave privada NO se envía a la CA."

          - ""

          - "SIGUIENTE PASO DEL WORKFLOW:"

          - "  Firmar CSR utilizando"
          - "  Ansible Demo Issuing CA"

          - "=========================================================="

